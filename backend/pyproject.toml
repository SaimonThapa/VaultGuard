# Tool configuration only; dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade, S: flake8-bandit (security)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # assert is pytest; passwords here are fictional
"scripts/**" = ["I001", "E402", "E501", "S105"]  # scripts load .env before importing app; demo data is fictional

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
